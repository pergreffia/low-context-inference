services:
  context-proxy:
    build: .
    env_file: .env
    environment:
      DATABASE__URL: postgresql://${POSTGRES_USER:-context_proxy}:${POSTGRES_PASSWORD:-context_proxy}@postgres:5432/${POSTGRES_DB:-context_proxy}
      # M3+: Qdrant is a live dependency of the memory service. Inside the
      # Compose network it is reachable ONLY via the service name below;
      # localhost would point at the proxy container itself.
      QDRANT__BASE_URL: http://qdrant:6333
      # INFERENCE__BASE_URL / EMBEDDINGS__BASE_URL are EXTERNAL services by
      # default (localhost on the host). When running them inside Compose,
      # override with their service names here.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Optional administrative gate for /internal/* (empty = network-only
      # boundary, local development stays friction-free).
      SECURITY__INTERNAL_AUTH_TOKEN: ${SECURITY__INTERNAL_AUTH_TOKEN:-}
    ports:
      # Porta PUBBLICATA sull'host (default 11435, adiacente al range Ollama
      # per evitare conflitti con le web-app che tipicamente occupano 8080).
      # Il container ascolta SEMPRE internamente su 8080: non usare
      # SERVER__PORT qui, cambierebbe anche la porta interna (CMD uvicorn).
      - "${PROXY_PORT:-11435}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    # Container hardening (post-0876b10 review §13): the proxy needs no
    # privileges and writes nothing outside its own user.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-context_proxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-context_proxy}
      POSTGRES_DB: ${POSTGRES_DB:-context_proxy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host access is bound to loopback ONLY (post-0876b10 review §2): the
    # database must never be reachable from other hosts. Container-to-
    # container traffic keeps using the service name and needs no published
    # port at all; remove this block entirely if no host tooling is needed.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-context_proxy} -d ${POSTGRES_DB:-context_proxy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # Pinned version (review §13): never drift with :latest.
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6344:6344"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':< /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # M5: memory-service, embedding-service join here as needed; when added,
  # point EMBEDDINGS__BASE_URL at their service names.
volumes:
  pgdata:
  qdrant_storage:
