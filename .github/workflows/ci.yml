name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deterministic installs via `python -m pip` (M6-final review §7.1).
      - name: Install dependencies (locked via constraints.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt
          python -m pip install ruff -c constraints.txt
      - name: Ruff (configured rules)
        run: ruff check .
      # Fast suite only: PostgreSQL-backed tests auto-skip without
      # TEST_DATABASE_URL (explicit contract, see integration job).
      - name: Unit tests
        run: python -m pytest -q

  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: context_proxy
          POSTGRES_PASSWORD: context_proxy
          POSTGRES_DB: context_proxy
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U context_proxy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Consumed by the suites to run migrations + PG-backed tests.
      TEST_DATABASE_URL: postgresql://context_proxy:context_proxy@localhost:55432/context_proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (locked via constraints.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt
          python -m pip install ruff -c constraints.txt
      - name: Ruff
        run: ruff check .
      # Full suite against a clean PostgreSQL instance: exercises every
      # migration from scratch and must not silently skip.
      - name: Integration tests (PostgreSQL)
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: context-proxy:ci
      # Lightweight runtime smoke test: entrypoint, imports, healthcheck.
      # No PostgreSQL/Qdrant needed — the proxy degrades gracefully.
      - name: Smoke test (healthz)
        run: |
          docker run -d --name smoke -p 8080:8080 context-proxy:ci
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT

          healthy=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /tmp/health.json; then
              healthy=true
              break
            fi
            sleep 1
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::Container did not become healthy within timeout"
            docker logs smoke || true
            exit 1
          fi

          cat /tmp/health.json
          grep -Eq '"status": ?"ok"' /tmp/health.json
          curl -sf http://localhost:8080/metrics > /dev/null
